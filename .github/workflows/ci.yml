name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growth_ci_test?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growth_ci_test?schema=public
  NODE_ENV: test

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growth_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy
      - name: Migration gate - target guard (fail-closed)
        run: node apps/api/scripts/db-safety.mjs guard --url "$TEST_DATABASE_URL" --role test
      - name: Migration gate - history and checksum integrity
        run: node apps/api/scripts/db-safety.mjs history --url "$TEST_DATABASE_URL"
      - name: Migration gate - db fingerprint (read-only, fail-closed on DIVERGED/UNKNOWN)
        run: node apps/api/scripts/db-safety.mjs fingerprint --url "$TEST_DATABASE_URL"
      - name: Migration gate - schema convergence (zero unexpected drift)
        run: node apps/api/scripts/db-safety.mjs convergence --url "$TEST_DATABASE_URL"
      - name: Migration gate - fresh replay (dedicated disposable database)
        run: node apps/api/scripts/db-replay.mjs fresh
      - name: Migration gate - upgrade replay (previous canonical state to latest)
        run: node apps/api/scripts/db-replay.mjs upgrade
      - name: Migration gate - shadow convergence (dedicated disposable shadow target)
        run: node apps/api/scripts/db-replay.mjs shadow
      - name: Migration gate - PostgreSQL object names (<=63 bytes)
        run: node apps/api/scripts/db-safety.mjs object-names
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Pool benchmark (read-only, functional + capacity gate; latency is reported, not gated)
        run: node apps/api/scripts/pool-benchmark.mjs --url "$TEST_DATABASE_URL" --candidates 1,2,3,5,8 --queries 40 --sleep-ms 25
      - name: Migration gate - negative proofs (drift, checksum, unsafe target, object names)
        run: node apps/api/scripts/db-replay.mjs negative-proof
