# Local stack: Postgres + migrations + API.
#
# Setup: derive a real env file from the example first (the db service reads
# it when present, but sane defaults below keep the database services working
# without one):
#   cp .env.example .env
#
# Usage (from the repository root):
#   docker compose -f docker/docker-compose.yml up -d db migrate   # database + migrations
#   docker compose -f docker/docker-compose.yml up -d              # db + migrate + api
#
# api startup contract (PR-D1R):
#   - The api service runs NODE_ENV=production by default, so it needs an
#     explicit HOST and a real GROWTH_INTERNAL_API_KEY. A missing value makes the
#     container exit at startup (fail-closed) instead of starting half-configured.
#   - Compose interpolation reads the shell environment, docker/.env, or a file
#     passed with --env-file. The repository-root .env configures host-run
#     processes and is NOT read here unless `--env-file .env` is passed.
#   - The published port needs a non-loopback bind inside the container; that is
#     granted explicitly by ALLOW_EXTERNAL_BIND below. The port itself is
#     published on 127.0.0.1 only - widen it deliberately, never by default.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-growth_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending Prisma migrations, then exits. The api service
  # only starts after this completes successfully.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-growth_db}?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-growth_db}?schema=public
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      # PR-D1 exposure contract (SYS-1/SYS-2) and the internal auth boundary
      # (ADR-023). Forwarding these is what lets a production-mode container
      # start instead of exiting before a socket opens.
      HOST: ${HOST:-0.0.0.0}
      ALLOW_EXTERNAL_BIND: ${ALLOW_EXTERNAL_BIND:-true}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      # An empty value means "not configured": development starts without a key,
      # while the production default above stays fail-closed.
      GROWTH_INTERNAL_API_KEY: ${GROWTH_INTERNAL_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      # Loopback publish: reachable from this host, not from the network.
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
